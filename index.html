<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPS Teamstore | Catálogo</title>
<meta name="description" content="Catálogo JPS Teamstore — chuteiras, camisas de time e artigos esportivos. Confira os modelos e compre pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   SPORT STORE — CATÁLOGO
   Estrutura: Coleções > Produtos (ver array DATA no <script> final)
   Placeholder de marca/cores — trocar quando tiver identidade real
   ══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#0B0D0C;color:#F2F4F3;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}

:root{
  --bg:#0B0D0C; --bg2:#141715; --card:#181B19;
  --border:rgba(255,255,255,.08);
  --text:#F2F4F3; --t2:#9CA39F; --t3:#5E645F;
  --accent:#39D97A; --accent-dk:#1FA85A; --accent-bg:rgba(57,217,122,.1);
  --red:#EF4444; --red-bg:rgba(239,68,68,.12);
  --amber:#F5A623; --amber-bg:rgba(245,166,35,.12);
  --hero-bg:none;
}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,13,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:.875rem 1.5rem}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.625rem;font-family:'Inter',sans-serif;font-weight:900;font-size:1.0625rem;letter-spacing:-.01em;text-transform:uppercase}
.logo img{height:40px;width:auto}
.btn-wa-top{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#06110A;font-weight:800;font-size:.8125rem;padding:.625rem 1.125rem;border-radius:999px;transition:opacity .2s}
.btn-wa-top:hover{opacity:.88}

/* ── HERO ── */
.hero{position:relative;padding:5.5rem 1.5rem 4rem;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:var(--hero-bg);background-size:cover;background-position:center 30%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,12,.55) 0%,rgba(11,13,12,.85) 75%,var(--bg) 100%)}
.hero-inner{position:relative;z-index:1;max-width:1280px;margin:0 auto}
.hero-tag{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(57,217,122,.35);background:var(--accent-bg);padding:.375rem 1rem;border-radius:999px;margin-bottom:1.25rem}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:900;letter-spacing:-.03em;line-height:.98;margin-bottom:.875rem;text-transform:uppercase}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--t2);font-size:1rem;max-width:520px}

/* ── FILTROS ── */
.filters{max-width:1280px;margin:0 auto;padding:1.25rem 1.5rem;display:flex;gap:.625rem;flex-wrap:wrap;position:sticky;top:64px;z-index:90;background:var(--bg)}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--t2);font-size:.8125rem;font-weight:700;padding:.5rem 1.125rem;border-radius:999px;cursor:pointer;transition:all .2s}
.filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.filter-btn.active{background:var(--accent);color:#06110A;border-color:var(--accent)}

/* ── COLEÇÃO (seção) ── */
.colecoes{max-width:1280px;margin:0 auto;padding:.5rem 1.5rem 4rem}
.colecao{padding:2.5rem 0;border-top:1px solid var(--border)}
.colecao:first-child{border-top:none}
.colecao-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.colecao-nome{font-size:1.375rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:.625rem}
.colecao-nome::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent)}
.colecao-count{font-size:.8125rem;color:var(--t3);font-weight:600}

/* ── GRID DE PRODUTOS ── */
.produtos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.125rem}
.produto{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s}
.produto:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18)}

.produto-img{aspect-ratio:1/1;position:relative;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.produto-img img{width:100%;height:100%;object-fit:cover}
.produto-img.ph{color:var(--t3);font-size:.75rem;font-weight:700;text-align:center;padding:1rem;border-bottom:1px dashed var(--border)}
.produto-badge{position:absolute;top:.625rem;left:.625rem;font-size:.65rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.25rem .625rem;border-radius:999px}
.badge-disponivel{background:var(--accent-bg);color:var(--accent)}
.badge-encomenda{background:var(--amber-bg);color:var(--amber)}
.badge-esgotado{background:var(--red-bg);color:var(--red)}

.produto-body{padding:.875rem .9375rem 1rem}
.produto-nome{font-size:.875rem;font-weight:700;margin-bottom:.75rem;line-height:1.35}
.produto-btn{display:flex;align-items:center;justify-content:center;gap:.4375rem;width:100%;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:.75rem;font-weight:800;padding:.5rem;border-radius:999px;transition:all .2s}
.produto-btn:hover{background:var(--accent);color:#06110A}
.produto-btn svg{width:13px;height:13px;flex-shrink:0}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);padding:2.5rem 1.5rem;text-align:center}
.foot-note{font-size:.8125rem;color:var(--t3);margin-bottom:1rem}
.foot-wa{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#06110A;font-weight:800;font-size:.875rem;padding:.75rem 1.5rem;border-radius:999px}

/* ── FLOATING WA ── */
.wa-float{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,.4)}
.wa-float svg{width:26px;height:26px;fill:#fff}

@media(max-width:520px){
  .filters{top:58px}
  .produtos-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>

async function carregarDados(){
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/produtos?select=colecao,produto,status,imagem_url&order=criado_em.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }, cache: "no-store" }
    );
    if (!res.ok) throw new Error("fetch falhou: " + res.status);
    const rows = await res.json();
    const map = new Map();
    rows.forEach(r => {
      const colecaoNome = (r.colecao || "").trim();
      const nome = (r.produto || "").trim();
      if (!colecaoNome || !nome) return;
      const status = r.status === "encomenda" ? "encomenda" : "disponivel";
      const imagem = r.imagem_url || null;
      if (!map.has(colecaoNome)) map.set(colecaoNome, { nome: colecaoNome, produtos: [] });
      map.get(colecaoNome).produtos.push({ nome, status, imagem });
    });
    const colecoes = [...map.values()];
    return colecoes.length ? colecoes : DEMO_COLECOES;
  } catch (e){
    console.warn("Não consegui carregar os produtos do banco, usando os produtos de exemplo.", e);
    return DEMO_COLECOES;
  }
}

function renderFiltros(COLECOES){
  const cats = ["Todos", ...new Set(COLECOES.map(c => c.categoria || c.nome))];
  const el = document.getElementById("filters");
  el.innerHTML = cats.map((c,i) =>
    `<button class="filter-btn${i===0?' active':''}" data-cat="${c}">${c}</button>`
  ).join("");
  el.addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    el.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filtrarPorCategoria(btn.dataset.cat);
  });
}

      </div>
      <div class="produto-body">
        <div class="produto-nome">${p.nome}</div>
        <a class="produto-btn" href="${waLink(msg)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.091.535 4.058 1.475 5.776L0 24l6.224-1.475C7.942 23.465 9.909 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818c-1.881 0-3.663-.508-5.21-1.396l-.373-.22-3.894.922.94-3.785-.243-.388C2.19 15.333 1.636 13.716 1.636 12 1.636 6.3 6.3 1.636 12 1.636S22.364 6.3 22.364 12 17.7 21.818 12 21.818z"/></svg>
          Falar no WhatsApp
        </a>
      </div>
    </div>`;
}

function renderColecoes(COLECOES){
  const el = document.getElementById("colecoes");
  el.innerHTML = COLECOES.map(c => `
    <div class="colecao" data-cat="${c.categoria || c.nome}">
      <div class="colecao-head">
        <div class="colecao-nome">${c.nome}</div>
        <div class="colecao-count">${c.produtos.length} modelo${c.produtos.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="produtos-grid">
        ${c.produtos.map(p => produtoCard(p, c.nome)).join("")}
      </div>
    </div>
  `).join("");
}

function filtrarPorCategoria(cat){
  document.querySelectorAll(".colecao").forEach(sec => {
    sec.style.display = (cat === "Todos" || sec.dataset.cat === cat) ? "" : "none";
  });
}

function setWaButtons(){
  const msg = "Oi! Vim pelo site e quero saber mais sobre os produtos.";
  ["topWaBtn","footWaBtn","floatWaBtn"].forEach(id => {
    document.getElementById(id).href = waLink(msg);
  });
}

(async function init(){
  const COLECOES = await carregarDados();
  renderFiltros(COLECOES);
  renderColecoes(COLECOES);
  setWaButtons();
})();
</script>
